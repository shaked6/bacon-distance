services:
  db-builder:
    build:
      context: .
      dockerfile: Dockerfile.db
    volumes:
      - ./src/data:/app/src/data
      - actors_db:/app/src/db
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      db-builder:
        condition: service_completed_successfully
    volumes:
      - actors_db:/app/src/db
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  actors_db:
